description: "Task 04 — json-extract: отладка сломанного промпта-экстрактора"

providers:
  - id: ${PROMPTFOO_TARGET_MODEL}

# Промпт кандидата подкладывается оркестратором в этот файл.
# Кандидат сам пишет финальный промпт — мы только подмешиваем {{input}} (текст письма)
# из каждого кейса в hidden/tests.yaml.
prompts:
  - file://_submission_prompt.txt

# Скрытые кейсы. Каждый — vars (письмо) + assertions (JSON-валидность, схема, значения).
tests:
  - file://hidden/tests.yaml

# Дефолтные ассерты применяются ко всем кейсам (даже если в кейсе свои не описаны).
# В этой задаче мы делаем строгий is-json уровень дефолта — потому что JSON-формат
# обязателен для любого письма, независимо от содержимого.
#
# transform снимает markdown-обёртку (```json ... ```) перед всеми ассертами:
# некоторые модели (особенно Haiku) упорно оборачивают ответ в ```json даже при
# явной инструкции «без markdown». Снимаем, чтобы это не ломало is-json на всех
# кейсах. На «чистый JSON» дефекта это не влияет: если модель и так вернула
# чистый объект — replace ничего не найдёт и output останется как есть.
defaultTest:
  options:
    transform: 'output.replace(/^\s*```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim()'
    provider:
      id: ${PROMPTFOO_JUDGE_MODEL}
  assert:
    - type: is-json
